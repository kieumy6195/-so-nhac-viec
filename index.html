<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Nhắc Việc</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Nhắc Việc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* iOS grouped look: system font, gray grouped background, white inset cards, hairline separators, tint accent. */
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);
  --bar:rgba(249,249,249,.86);--red:#FF3B30;--green:#34C759;--shadow:0 8px 28px rgba(0,0,0,.12);
  --c-rose:#FF2D55;--c-coral:#FF3B30;--c-amber:#FF9500;--c-lime:#34C759;--c-teal:#30B0C7;--c-sky:#007AFF;--c-violet:#AF52DE;--c-slate:#8E8E93;
  --tint:var(--c-rose);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
:root[data-tint="sky"]{--tint:var(--c-sky)}:root[data-tint="lavender"]{--tint:var(--c-violet)}:root[data-tint="peach"]{--tint:var(--c-amber)}:root[data-tint="mint"]{--tint:var(--c-lime)}:root[data-tint="teal"]{--tint:var(--c-teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --bar:rgba(22,22,24,.86);--red:#FF453A;--green:#30D158;--shadow:0 8px 28px rgba(0,0,0,.6);
  --c-rose:#FF375F;--c-coral:#FF453A;--c-amber:#FF9F0A;--c-lime:#30D158;--c-teal:#40C8E0;--c-sky:#0A84FF;--c-violet:#BF5AF2;--c-slate:#98989D;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --bar:rgba(22,22,24,.86);--red:#FF453A;--green:#30D158;--shadow:0 8px 28px rgba(0,0,0,.6);
  --c-rose:#FF375F;--c-coral:#FF453A;--c-amber:#FF9F0A;--c-lime:#30D158;--c-teal:#40C8E0;--c-sky:#0A84FF;--c-violet:#BF5AF2;--c-slate:#98989D;color-scheme:dark}
.c-rose{--c:var(--c-rose)}.c-coral{--c:var(--c-coral)}.c-amber{--c:var(--c-amber)}.c-lime{--c:var(--c-lime)}.c-teal{--c:var(--c-teal)}.c-sky{--c:var(--c-sky)}.c-violet{--c:var(--c-violet)}.c-slate{--c:var(--c-slate)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.29;letter-spacing:-.41px;overscroll-behavior-y:none}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;letter-spacing:inherit;color:var(--label)}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.em{font-family:var(--emoji);font-style:normal;line-height:1}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 150px)}
.nav{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-height:44px}
.navbtn{height:36px;min-width:36px;padding:0 8px;border-radius:18px;display:grid;place-items:center;color:var(--tint);font-size:17px}
.navbtn:active{opacity:.4}
.lt{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.2;margin:0 0 2px}
.sub{color:var(--label2);font-size:15px;margin:0 0 16px;letter-spacing:-.24px}
.sub .hol{color:var(--red)}

.sec{margin:0 0 22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 6px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px}
.sh.big{text-transform:none;font-size:20px;font-weight:700;color:var(--label);letter-spacing:.38px;padding-left:4px}
.sh button{color:var(--tint);text-transform:none;font-size:15px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.foot{padding:6px 16px 0;font-size:13px;color:var(--label2);letter-spacing:-.08px}

.row{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;width:100%;background:var(--card)}
.row+.row::before,.swr+.swr::before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;height:.5px;background:var(--sep);z-index:2}
.row:active,button.row:active{background:var(--fill)}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt{overflow-wrap:anywhere}
.rs{font-size:15px;color:var(--label2);letter-spacing:-.24px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.rs .late{color:var(--red)}
.rv{color:var(--label2);font-size:17px;white-space:nowrap}
.chev{color:var(--label3);flex:none}
.empty{padding:14px 16px;color:var(--label2);font-size:15px}

/* event row */
.ev{--inset:16px}
.ev .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.ev .tm{width:50px;flex:none;font-size:15px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;line-height:1.25}
.ev .tm small{color:var(--label2);font-size:13px}
.ev .lab{font-family:var(--emoji);font-size:15px}

/* checkbox */
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);flex:none;display:grid;place-items:center;color:#fff;transition:transform .15s}
.ck:active{transform:scale(.85)}
.ck.on{background:var(--tint);border-color:var(--tint)}
.done .rt{color:var(--label2);text-decoration:line-through}

/* habit ring */
.ring{width:32px;height:32px;flex:none;position:relative;display:grid;place-items:center;color:var(--c)}
.ring svg{position:absolute;inset:0}
.ring .em{font-size:15px}
.ring.full .em{display:none}
.hcount{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 16px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:500;text-align:center;letter-spacing:-.08px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

/* month */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.mhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.38px}
.mhead h2 span{color:var(--tint)}
.mnav{display:flex;gap:4px}
.mnav button{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--tint)}
.mnav button:active{background:var(--fill)}
.cal{background:var(--card);border-radius:12px;padding:8px 6px 6px;margin-bottom:22px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wd span{text-align:center;font-size:11px;font-weight:600;color:var(--label2);padding:2px 0 6px;text-transform:uppercase}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0 5px;min-height:56px;border-radius:10px}
.day .n{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.day .lu{font-size:10px;color:var(--label2);line-height:1;height:10px}
.day .lu.m1{color:var(--tint);font-weight:600}
.day .dots{display:flex;gap:3px;height:6px;align-items:center}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day.out{opacity:.3}
.day.off .n{color:var(--red)}
.day.today .n{color:var(--tint);font-weight:600}
.day.sel .n{background:var(--label);color:var(--bg);font-weight:600}
.day.sel.today .n{background:var(--tint);color:#fff}
.day:active .n{background:var(--fill)}

/* quick add */
.qa{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);z-index:20;padding:8px 12px;pointer-events:none}
.qa-in{max-width:560px;margin:0 auto;pointer-events:auto}
.qa-box{display:flex;align-items:flex-end;gap:8px;background:var(--card);border-radius:22px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);border:.5px solid var(--sep)}
.qa-box textarea{flex:1;min-width:0;border:0;background:none;resize:none;font-size:17px;line-height:22px;padding:5px 0;max-height:110px;outline:none}
.qa-box textarea::placeholder{color:var(--label3)}
.qa-go{width:32px;height:32px;border-radius:16px;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}
.qa-go:disabled{background:var(--fill2);color:var(--label3)}
.qa-mic{width:32px;height:32px;display:grid;place-items:center;color:var(--label2);flex:none}
.pv{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:.5px solid var(--sep);padding:12px 14px;margin-bottom:8px}
.pv-t{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.pv-t .em{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:12px;background:var(--fill);color:var(--label);letter-spacing:-.08px}
.chip.k{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint);font-weight:600}
.pv-more{font-size:13px;color:var(--label2);margin-top:8px}
.hints{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding:2px}
.hints::-webkit-scrollbar{display:none}
.hints button{flex:none;font-size:13px;padding:6px 12px;border-radius:15px;background:var(--card);border:.5px solid var(--sep);box-shadow:0 2px 8px rgba(0,0,0,.06);white-space:nowrap}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:50px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--label2);letter-spacing:.1px}
.tab[aria-current="page"]{color:var(--tint)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:12px 12px 0 0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@media (min-width:600px){.sheet{align-items:center}.panel{border-radius:14px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.ph{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;margin:0 -16px 8px;padding:0 16px;background:var(--bg)}
.ph::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3)}
.ph h2{margin:0;font-size:17px;font-weight:600;text-align:center}
.ph .l{justify-self:start;color:var(--tint)}.ph .r{justify-self:end;color:var(--tint);font-weight:600}
.ph .r:disabled{color:var(--label3)}
.f{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 16px;position:relative;background:var(--card)}
.f+.f::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.f label,.f>span{flex:1}
.f input[type=text],.f input:not([type]),.f textarea{flex:1;border:0;background:none;outline:none;padding:6px 0;min-width:0;font-size:17px}
.f textarea{resize:vertical;min-height:88px;line-height:1.35}
.f input[type=date],.f input[type=time],.f select,.f input[type=number]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none;color:var(--label);min-height:34px;text-align:right}
.f select{padding-right:10px;text-align:left;color:var(--tint);background:none}
.big-in{font-size:20px!important;font-weight:600}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.wdp{display:flex;gap:6px;padding:10px 16px;background:var(--card);position:relative}
.wdp::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.wdp button{flex:1;height:36px;border-radius:18px;background:var(--fill);font-size:13px;font-weight:600}
.wdp button[aria-pressed="true"]{background:var(--tint);color:#fff}
.labs{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--card);position:relative}
.labs:first-child::before,.wdp:first-child::before{display:none}
.labs::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.lb{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;background:var(--fill);font-size:15px}
.lb[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 1.5px var(--c);font-weight:600}
.btnrow{display:flex;flex-direction:column;gap:8px;margin:8px 0 22px}
.bt{width:100%;min-height:50px;border-radius:12px;background:var(--card);color:var(--tint);font-weight:400;text-align:center;font-size:17px}
.bt.del{color:var(--red)}
.bt.pri{background:var(--tint);color:#fff;font-weight:600}
.moods{display:flex;justify-content:space-between;padding:10px 16px;background:var(--card);gap:6px}
.moods button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--label2)}
.moods button .em{font-size:30px}
.moods button[aria-pressed="true"]{background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--label);font-weight:600}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px 12px;background:var(--card)}
.emojis button{height:40px;border-radius:10px;font-family:var(--emoji);font-size:24px;display:grid;place-items:center}
.emojis button[aria-pressed="true"]{background:var(--fill2)}
.colors{display:flex;gap:10px;padding:12px 16px;background:var(--card);flex-wrap:wrap;position:relative}
.colors button{width:30px;height:30px;border-radius:50%;background:var(--c)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.tlist{display:flex;flex-direction:column}
.err{color:var(--red);font-size:15px;padding:8px 16px 0}

/* swipe */
.swr{position:relative;overflow:hidden;background:var(--card)}
.swr.on{background:var(--red)}
.swr .sbg{opacity:0}.swr.on .sbg{opacity:1}
.swr .sbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:#fff;font-size:15px;font-weight:600}
.swr>.row{transition:transform .22s ease;z-index:1}
.swr>.row.drag{transition:none}
.swr>.row::before{display:none}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;width:calc(100% - 24px);max-width:520px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:.5px solid var(--sep);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;animation:drop .3s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.toast .tb{flex:1;min-width:0}
.toast b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast span{font-size:13px;color:var(--label2)}
.toast button{color:var(--tint);font-size:15px;font-weight:600;padding:6px 8px}

/* notes */
.nt .rt{font-weight:600}
.nt .rs{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm .em{font-size:28px}
.bk .bi{width:30px;height:30px;border-radius:7px;background:var(--c);display:grid;place-items:center;flex:none;font-family:var(--emoji);font-size:17px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat{background:var(--card);border-radius:12px;padding:12px 14px}
.stat small{display:block;font-size:13px;color:var(--label2)}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="nav" id="nav"></div>
  <main id="main"></main>
</div>
<div class="qa"><div class="qa-in">
  <div id="qa-pv"></div>
  <form class="qa-box" id="qa-form" autocomplete="off">
    <textarea id="qa" rows="1" enterkeyhint="done" placeholder="Gõ để thêm: mai 8h khám răng" aria-label="Thêm nhanh bằng câu chữ"></textarea>
    <button class="qa-go" id="qa-go" type="submit" aria-label="Thêm" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</div></div>
<nav class="tabbar" aria-label="Các mục"><div class="tabs" id="tabs"></div></nav>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast-host"></div>
<script src="nlp.js"></script>
<script src="app.js"></script>
</body>
</html>
